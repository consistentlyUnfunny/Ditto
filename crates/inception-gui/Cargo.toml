[package]
name = "inception-gui"
description = "Desktop control surface for project-inception."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "inception-gui"
path = "src/main.rs"

# Like the CLI, this is a thin shell: every decision lives in inception-core, so
# the two frontends can never disagree about what a deploy will do (NF-5.1).
[dependencies]
inception-core = { path = "../inception-core" }
tauri = { version = "2.11", features = [] }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[lints.rust]
unsafe_code = "forbid"
